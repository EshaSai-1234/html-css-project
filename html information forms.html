<br>
<hr>
<br>
<h2>Application Form</h2>
<form>
    <label for="name">name:</label>
    <input type="text" name="name">
    <br>
    <br>
    <label for="gender">gender:</label>
    <input type="text" name="name">
    <input type="radio" name="gender" id="male" value="male">
    <label for="male">Male</label>
    <input type="radio" name="gender" id="female" value="female">
    <label for="female">Female</label>
    <br>
    <br>
    <label for="country">Country:</label>
    <select name="country" id="country">
        <option>Select an option</option>
        <option value="India">India</option>
        <option value="USA">USA</option>
        <option value="Nepal">Nepal</option>
        <option value="Canada">Canada</option>
    </select>
    <br>
    <br>
    <label for="message">Message:</label>
    <br>
    <textarea name="message" id="message" cols="30" rows="4"></textarea>
    <br>
    <input type="checkbox" name="newsletter" id="newsletter">
    <label for="newsletter">Subscribe?</label>
    <br>
    <br>
    <button>Submit</button>
</form>
<br>
<hr>
<br>
<h2>Feedback</h2>
<form action="/contact">
    <label for="name">Name:</label>
    <input type="text" placeholder="Write your email" id="email">
    <br>
    <br>
    <label for="message">Message:</label>
    <br>
    <textarea name="message" id="message" cols="30"></textarea>
    <br>
    <br>

    <label for="rating">Rate us out of 5:</label>
    <br>
    <br>
    <input type="radio" name="rating" id="one" value="one">
    <label for="one">1</label>
    <br>
    <br>
    <input type="radio" name="rating" id="two" value="two">
    <label for="two">2</label>
    <br>
    <br>
    <input type="radio" name="rating" id="three" value="three">
    <label for="three">3</label>
    <br>
    <br>
    <input type="radio" name="rating" id="four" value="four">
    <label for="four">4</label>
    <br>
    <br>
    <input type="radio" name="rating" id="five" value="five">
    <label for="five">five</label>
    <br>
    <br>
    <button>Send your message!</button>
</form>
